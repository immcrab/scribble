name = "lofin"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Lofin is a single Worker deployment: static assets serve the React app
# while /api/* is handled by src/index.ts.  Hosting them together means the
# browser can use the same origin for both the app and its API.
[assets]
directory = "../frontend/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

# Cloudflare manages the DNS record and TLS certificate for these custom
# domains in the active lofin.dev zone. Cloudflare provisions the DNS records
# and HTTPS certificates for these Worker Custom Domains on deployment.
[[routes]]
pattern = "lofin.dev"
custom_domain = true

[[routes]]
pattern = "www.lofin.dev"
custom_domain = true

[[routes]]
pattern = "ai.lofin.dev"
custom_domain = true

# Comma-separated list of allowed origins for CORS, e.g. your GitHub Pages
# domain. Set with: wrangler secret put ALLOWED_ORIGINS  (or as a plain var
# below if you don't mind it being public — it's not sensitive).
[vars]
ALLOWED_ORIGINS = "http://localhost:5173,https://lofin.dev,https://www.lofin.dev"
# Announcement artwork storage. Images are served through this Worker, so no
# separate public R2 domain is needed.
FIREBASE_PROJECT_ID = "rypotic-playground"
[[r2_buckets]]
binding = "ANNOUNCEMENT_ASSETS"
# Existing storage resource retained so previously published announcement art
# remains available; public URLs are served from the Lofin Worker.
bucket_name = "scribble-announcements"
# Secrets (never commit real values — set these with `wrangler secret put NAME`):
#   XKIRO_API_KEY       (chat provider + richer web search + GPT Image backend + text-to-speech)
#   GROQ_API_KEY        (not a selectable provider — only powers chat-title generation)
#   MISTRAL_API_KEY
#   GEMINI_API_KEY
#   OPENROUTER_API_KEY
#   ZAI_API_KEY         (Z.ai / Zhipu AI — the GLM model family)
#   LOFIN_PASSWORD      (optional — omit to leave Lofin open/unauthenticated)
#   CF_ACCOUNT_ID       (Cloudflare account id — powers /api/image/generate)
#   CF_AI_TOKEN         (Workers AI-scoped API token — powers /api/image/generate)
