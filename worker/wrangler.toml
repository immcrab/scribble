name = "scribble-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Comma-separated list of allowed origins for CORS, e.g. your GitHub Pages
# domain. Set with: wrangler secret put ALLOWED_ORIGINS  (or as a plain var
# below if you don't mind it being public — it's not sensitive).
[vars]
ALLOWED_ORIGINS = "http://localhost:5173,https://immcrab.github.io,https://scribbleai.dev"
# From address for the verification email (not sensitive). Domain must be
# verified in Resend.
VERIFY_EMAIL_FROM = "Scribble <scribble@owenis.me>"
# Rewrites the verification link to land on our own branded action page
# (pages/AuthActionPage.tsx) instead of Firebase's default handler — the
# console's custom-action-URL field is locked on this project.
VERIFY_ACTION_URL = "https://scribbleai.dev/auth/action"
# Announcement artwork storage. Images are served through this Worker, so no
# separate public R2 domain is needed.
FIREBASE_PROJECT_ID = "rypotic-playground"
[[r2_buckets]]
binding = "ANNOUNCEMENT_ASSETS"
bucket_name = "scribble-announcements"
# Optional: where the verification link sends the user after the code is
# consumed. Leave unset to use Firebase's default post-verification page.
# VERIFY_CONTINUE_URL = "https://scribbleai.dev/signin"

# Secrets (never commit real values — set these with `wrangler secret put NAME`):
#   XKIRO_API_KEY       (chat provider + richer web search + GPT Image backend + text-to-speech)
#   GROQ_API_KEY        (not a selectable provider — only powers chat-title generation)
#   MISTRAL_API_KEY
#   GEMINI_API_KEY
#   OPENROUTER_API_KEY
#   ZAI_API_KEY         (Z.ai / Zhipu AI — the GLM model family)
#   SCRIBBLE_PASSWORD   (optional — omit to leave Scribble open/unauthenticated)
#   CF_ACCOUNT_ID       (Cloudflare account id — powers /api/image/generate)
#   CF_AI_TOKEN         (Workers AI-scoped API token — powers /api/image/generate)
#   FIREBASE_SERVICE_ACCOUNT  (full Firebase service account JSON — /api/auth/send-verification)
#   RESEND_API_KEY            (Resend key re_... — sends the verification email)
