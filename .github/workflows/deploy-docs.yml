name: Deploy Lofin Docs

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lofin-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build docs site
        working-directory: frontend
        run: npm run build
        env:
          VITE_DOCS_SITE: "true"
      # The docs Pages project serves the same application, but docs.lofin.dev
      # makes the docs router use / rather than the legacy /docs prefix.
      - name: Add crawler entry points
        run: |
          cp frontend/dist/docs-robots.txt frontend/dist/robots.txt
          cp frontend/dist/docs-sitemap.xml frontend/dist/sitemap.xml
      - name: Create docs Pages project if needed
        # Wrangler returns a non-zero status when the project already exists;
        # the deploy below remains the authoritative check in either case.
        run: npx wrangler pages project create lofin-docs --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Attach docs.lofin.dev
        run: |
          docs_domains=$(curl --fail-with-body \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/lofin-docs/domains" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          if echo "$docs_domains" | jq -e '.result[] | select(.name == "docs.lofin.dev")' > /dev/null; then
            exit 0
          fi
          curl --fail-with-body --request POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/lofin-docs/domains" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"name":"docs.lofin.dev"}'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Point docs DNS at Pages
        run: |
          zone_id=$(curl --fail-with-body \
            "https://api.cloudflare.com/client/v4/zones?name=lofin.dev" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | jq -r '.result[0].id')
          test -n "$zone_id" && test "$zone_id" != "null"
          docs_record=$(curl --fail-with-body \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?type=CNAME&name=docs.lofin.dev" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | jq -r '.result[0].id // empty')
          if test -n "$docs_record"; then
            exit 0
          fi
          curl --fail-with-body --request POST \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"type":"CNAME","name":"docs","content":"lofin-docs.pages.dev","ttl":1,"proxied":true}'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Publish to Cloudflare Pages
        working-directory: frontend
        run: npx wrangler pages deploy dist --project-name=lofin-docs --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
