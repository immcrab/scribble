name: Deploy Lofin app

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "worker/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers
  cancel-in-progress: true

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so sitemap <lastmod> dates come from real commit dates.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci
      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Ask Bing and other IndexNow engines to re-crawl pages changed in this deploy.
      - name: Notify IndexNow
        working-directory: frontend
        run: node scripts/indexnow.mjs
        continue-on-error: true

  build-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      # The Worker is the primary site at lofin.dev and is built at `/` in the
      # deploy-worker job. GitHub Pages hosts this repository at `/scribble/`.
      - name: Build GitHub Pages fallback
        working-directory: frontend
        run: npm run build
        env:
          VITE_BASE: /scribble/
          VITE_WORKER_URL: https://ai.lofin.dev
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages fallback
        id: deployment
        uses: actions/deploy-pages@v4
