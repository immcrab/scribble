<!doctype html>
<html lang="en">
  <head>
    <!-- GitHub Pages has no server-side routing, so 404.html redirects any deep link
         (e.g. /c/{id}) here as a "?/c/{id}" query string. Restore the real path before
         the app boots so client-side routing (see src/lib/router.ts) sees it. Must stay
         in sync with the matching script in public/404.html. -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
