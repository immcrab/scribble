<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Page not found — Scribble</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- GitHub Pages serves this file for any unknown path under the site (e.g. a shared
         /c/{id} link). Redirect to the app root with the real path packed into a "?/"
         query string; index.html's matching script unpacks it before the app boots. This
         is the standard rafgraph/spa-github-pages redirect pair — segmentCount must match
         the site's base path depth (0 for a domain root like scribbleai.dev/, 1 for a
         GitHub Pages subpath like "/scribble/") — see vite.config.ts. -->
    <script>
      (function (l) {
        var segmentCount = 0;
        l.replace(
          l.protocol +
            "//" +
            l.hostname +
            (l.port ? ":" + l.port : "") +
            l.pathname.split("/").slice(0, 1 + segmentCount).join("/") +
            "/?/" +
            l.pathname
              .slice(1)
              .split("/")
              .slice(segmentCount)
              .join("/")
              .replace(/&/g, "~and~") +
            (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
            l.hash
        );
      })(window.location);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,300;8..60,500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1b1a18;
        color: #e7e1da;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        padding: 24px;
      }
      .mark {
        width: 44px;
        height: 44px;
        margin: 0 auto 28px;
        display: block;
      }
      main {
        max-width: 420px;
        text-align: center;
      }
      .code {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: #827c73;
        text-transform: uppercase;
        margin: 0 0 12px;
      }
      h1 {
        font-family: "Source Serif 4", ui-serif, Georgia, serif;
        font-weight: 300;
        letter-spacing: -0.02em;
        font-size: 2.2rem;
        margin: 0 0 12px;
        color: #f5f0eb;
      }
      p {
        color: #9c9891;
        font-size: 0.95rem;
        line-height: 1.6;
        margin: 0 0 28px;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #f5f0eb;
        color: #1b1a18;
        font-weight: 500;
        font-size: 0.9rem;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 10px;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      a.button:hover {
        background: #ffffff;
        transform: translateY(-1px);
      }
      @media (prefers-reduced-motion: reduce) {
        a.button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="9" fill="#252523" />
        <path
          d="M16 6c1 6 3 9 10 10-7 1-9 4-10 10-1-6-3-9-10-10 7-1 9-4 10-10Z"
          fill="#f5f0eb"
        />
      </svg>
      <p class="code">404</p>
      <h1>Nothing scribbled here yet</h1>
      <p>This page doesn't exist, or moved. Head back and pick up where you left off.</p>
      <a class="button" href="/">← Back to Scribble</a>
    </main>
  </body>
</html>
